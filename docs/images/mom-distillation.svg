  <line x1="170" y1="100" x2="170" y2="120" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="450" y1="100" x2="450" y2="120" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="730" y1="100" x2="730" y2="120" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <line x1="170" y1="120" x2="730" y2="120" stroke="#333" stroke-width="2"/>
  <line x1="730" y1="120" x2="730" y2="140" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <rect x="340" y="140" width="220" height="45" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
