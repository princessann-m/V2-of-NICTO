  <line x1="450" y1="305" x2="450" y2="325" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <rect x="340" y="325" width="220" height="35" rx="6" fill="#ccfbf1" stroke="#14b8a6" stroke-width="2"/>
  <text x="450" y="345" text-anchor="middle" font-weight="bold" fill="#134e4a">SPECIALIZED MME EXPERTS</text>

