<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="monospace" font-size="12">
  <defs>
    <marker id="ah6" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="#f8f9fa"/>

  <text x="450" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a2e">MoM Distillation — Teacher → Student Pipeline</text>

  <rect x="80" y="45" width="180" height="55" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="170" y="65" text-anchor="middle" font-weight="bold" fill="#92400e">TEACHER MODELS</text>
  <text x="170" y="80" text-anchor="middle" fill="#92400e" font-size="10">Large general/specialist</text>
  <text x="170" y="93" text-anchor="middle" fill="#92400e" font-size="10">models with strong reasoning</text>

  <rect x="360" y="45" width="180" height="55" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="450" y="65" text-anchor="middle" font-weight="bold" fill="#92400e">REASONING TEACHER</text>
  <text x="450" y="80" text-anchor="middle" fill="#92400e" font-size="10">Chain-of-thought</text>
  <text x="450" y="93" text-anchor="middle" fill="#92400e" font-size="10">demonstrations</text>

  <rect x="640" y="45" width="180" height="55" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="730" y="65" text-anchor="middle" font-weight="bold" fill="#92400e">CODING TEACHER</text>
  <text x="730" y="80" text-anchor="middle" fill="#92400e" font-size="10">Code generation</text>
