  <line x1="450" y1="245" x2="450" y2="265" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <rect x="340" y="265" width="220" height="40" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
