<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="monospace" font-size="12">
  <defs>
    <marker id="ah4" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="480" fill="#f8f9fa"/>

  <text x="450" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a2e">MoM Verification & Multi-Judge System</text>

  <rect x="340" y="45" width="220" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="450" y="65" text-anchor="middle" font-weight="bold" fill="#92400e">CANDIDATE OUTPUTS (×3)</text>
  <text x="450" y="80" text-anchor="middle" fill="#92400e" font-size="10">From three independent MME systems</text>

  <line x1="450" y1="85" x2="450" y2="105" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <rect x="320" y="105" width="260" height="50" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="450" y="125" text-anchor="middle" font-weight="bold" fill="#991b1b">VERIFIER MODEL</text>
  <text x="450" y="143" text-anchor="middle" fill="#991b1b" font-size="10">Transformer-based · trained on verification data</text>
  <text x="450" y="158" text-anchor="middle" fill="#991b1b" font-size="10">Checks: factual · logical · numerical · evidence</text>

  <line x1="450" y1="155" x2="450" y2="175" stroke="#333" stroke-width="2"/>
  <line x1="450" y1="175" x2="250" y2="175" stroke="#333" stroke-width="2"/>
  <line x1="450" y1="175" x2="650" y2="175" stroke="#333" stroke-width="2"/>
  <polygon points="245,175 255,170 255,180" fill="#333"/>
  <polygon points="645,175 655,170 655,180" fill="#333"/>

  <rect x="140" y="175" width="140" height="35" rx="6" fill="#fca5a5" stroke="#ef4444" stroke-width="2"/>
  <text x="210" y="195" text-anchor="middle" font-weight="bold" fill="#991b1b">FAIL</text>
  <text x="210" y="208" text-anchor="middle" fill="#991b1b" font-size="10">→ Retry with feedback</text>

  <rect x="620" y="175" width="140" height="35" rx="6" fill="#86efac" stroke="#22c55e" stroke-width="2"/>
  <text x="690" y="195" text-anchor="middle" font-weight="bold" fill="#14532d">PASS</text>
  <text x="690" y="208" text-anchor="middle" fill="#14532d" font-size="10">→ Forward to judges</text>

  <line x1="210" y1="210" x2="210" y2="230" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="690" y1="210" x2="690" y2="230" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <rect x="80" y="230" width="260" height="45" rx="6" fill="#fef9c3" stroke="#eab308" stroke-width="2"/>
  <text x="210" y="250" text-anchor="middle" font-weight="bold" fill="#713f12">RETRY LOOP</text>
  <text x="210" y="268" text-anchor="middle" fill="#713f12" font-size="10">Max retries · deadline-aware · feedback to MME</text>

  <line x1="690" y1="260" x2="690" y2="280" stroke="#333" stroke-width="2"/>
  <line x1="690" y1="280" x2="500" y2="280" stroke="#333" stroke-width="2"/>
  <line x1="210" y1="275" x2="500" y2="275" stroke="#333" stroke-width="2"/>
  <polygon points="505,275 495,270 495,280" fill="#333"/>

  <rect x="380" y="280" width="160" height="45" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="460" y="300" text-anchor="middle" font-weight="bold" fill="#3730a3">JUDGE #1</text>
  <text x="460" y="318" text-anchor="middle" fill="#3730a3" font-size="10">Correctness · Relevance · Evidence</text>

  <rect x="380" y="340" width="160" height="45" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="460" y="360" text-anchor="middle" font-weight="bold" fill="#3730a3">JUDGE #2</text>
  <text x="460" y="378" text-anchor="middle" fill="#3730a3" font-size="10">Completeness · Reasoning · Uncertainty</text>

  <line x1="460" y1="325" x2="460" y2="340" stroke="#333" stroke-width="2" stroke-dasharray="4"/>
  <line x1="460" y1="385" x2="460" y2="400" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <rect x="320" y="400" width="220" height="40" rx="6" fill="#ccfbf1" stroke="#14b8a6" stroke-width="2"/>
  <text x="430" y="420" text-anchor="middle" font-weight="bold" fill="#134e4a">ARBITRATION</text>
  <text x="430" y="435" text-anchor="middle" fill="#134e4a" font-size="10">Agreement check · combined scoring · best candidate</text>

  <line x1="430" y1="440" x2="430" y2="460" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <rect x="340" y="460" width="180" height="35" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="430" y="482" text-anchor="middle" font-weight="bold" fill="#065f46">FINAL OUTPUT</text>

  <text x="450" y="505" text-anchor="middle" font-size="10" fill="#666">Judges run in parallel · arbitration selects strongest verified result</text>
</svg>