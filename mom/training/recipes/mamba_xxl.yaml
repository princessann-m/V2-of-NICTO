model:
  type: mamba2
  d_model: 1536
  n_layers: 80
  vocab_size: 50257
  expansion_factor: 2
  dt_rank: 384
  d_state: 16
  conv_kernel: 4

training:
  epochs: 2
  batch_size: 1
  gradient_accumulation_steps: 128
  learning_rate: 5e-5
  weight_decay: 0.1
  warmup_steps: 15000
  scheduler: cosine
  mixed_precision: bf16
  gradient_checkpointing: true
  max_grad_norm: 1.0

optimizer:
  name: adamw
  betas: [0.9, 0.95]
  eps: 1e-8

data:
  train_path: data/processed/splits/train.jsonl
  val_path: data/processed/splits/val.jsonl
  max_length: 2048
  num_workers: 16
  prefetch_factor: 8

hardware:
  devices: auto
  strategy: fsdp
  cpu_offload: true
  activation_checkpointing: true

logging:
  log_interval: 10
  eval_interval: 500
  save_interval: 1000
  project: nicto-experts
  experiment: mamba_xxl

checkpoint:
  dir: checkpoints/experts/mamba_xxl
  resume: null
  save_top_k: 2
