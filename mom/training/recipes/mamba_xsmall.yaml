model:
  type: mamba2
  d_model: 256
  n_layers: 16
  vocab_size: 50257
  expansion_factor: 2
  dt_rank: 64
  d_state: 16
  conv_kernel: 4

training:
  epochs: 3
  batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 1.5e-4
  weight_decay: 0.1
  warmup_steps: 2000
  scheduler: cosine
  mixed_precision: bf16
  gradient_checkpointing: true
  max_grad_norm: 1.0

optimizer:
  name: adamw
  betas: [0.9, 0.95]
  eps: 1e-8

data:
  train_path: data/processed/splits/train.jsonl
  val_path: data/processed/splits/val.jsonl
  max_length: 2048
  num_workers: 4
  prefetch_factor: 2

hardware:
  devices: auto
  strategy: ddp

logging:
  log_interval: 10
  eval_interval: 500
  save_interval: 1000
  project: nicto-experts
  experiment: mamba_xsmall

checkpoint:
  dir: checkpoints/experts/mamba_xsmall
  resume: null
  save_top_k: 2
