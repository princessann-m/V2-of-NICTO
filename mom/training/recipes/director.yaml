name: director
model_type: transformer
vocab_size: 32000
hidden_size: 768
num_layers: 12
num_heads: 12
ff_size: 3072
dropout: 0.1
max_seq_len: 2048
training:
  epochs: 5
  batch_size: 8
  learning_rate: 1e-4
  weight_decay: 0.01
  warmup_steps: 200
  gradient_accumulation_steps: 2
  max_grad_norm: 1.0
  mixed_precision: true
  distributed: false
  checkpoint_dir: checkpoints/director
  log_interval: 10
  save_interval: 1000
  val_interval: 1000
optimization:
  optimizer: adamw
  scheduler: cosine
  min_lr_ratio: 0.1
data:
  dataset: dummy
  num_workers: 0
